<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunted Oktoberfest is coming</title>
<style>
:root{--bg1:#1a1030;--bg2:#3a1a5c;--ink:#fff;--mute:#c9b9ea;--accent:#ff8a2b;--sage:#b5cba3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#f6f0ff;--bg2:#e3d3ff;--ink:#241545;--mute:#5d4d85;--accent:#d9640a;--sage:#4d6b3a}}
:root[data-theme="dark"]{--bg1:#1a1030;--bg2:#3a1a5c;--ink:#fff;--mute:#c9b9ea;--accent:#ff8a2b;--sage:#b5cba3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg1) 70%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
main{width:100%;max-width:900px}
.moon{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 66% 38%,var(--bg1) 0 30%,#ffd9a0 31%);box-shadow:0 0 32px rgba(255,200,120,.55)}
h1{margin:0;font-size:clamp(1.5rem,6vw,3rem);letter-spacing:.04em;color:var(--sage)}
.sub{margin:6px 0 26px;color:var(--mute);font-size:clamp(.95rem,3.4vw,1.3rem)}
.clock{display:flex;justify-content:center;align-items:flex-start;gap:clamp(4px,1.6vw,16px)}
.unit{min-width:0}
.num{font-size:clamp(2.6rem,15vw,7.5rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.lab{margin-top:8px;font-family:system-ui,sans-serif;font-size:clamp(.6rem,2.4vw,.95rem);letter-spacing:.12em;color:var(--mute)}
.sep{font-size:clamp(2.6rem,15vw,7.5rem);line-height:1;color:var(--accent);font-weight:700}
.info{margin-top:34px;display:inline-block;border:1px dashed var(--accent);border-radius:12px;padding:10px 18px;font-size:clamp(.9rem,3.2vw,1.15rem)}
#done{display:none;font-size:clamp(1.8rem,8vw,4rem);color:var(--accent);font-weight:700}
</style>
</head>
<body>
<main>
  <div class="moon" aria-hidden="true"></div>
  <h1>HAUNTED OKTOBERFEST IS COMING</h1>
  <p class="sub">Haunted Oktoberfest ойртож байна…</p>
  <div class="clock" id="clock" role="timer" aria-live="off">
    <div class="unit"><div class="num" id="d">00</div><div class="lab">DAYS<br>ӨДӨР</div></div>
    <div class="sep">:</div>
    <div class="unit"><div class="num" id="h">00</div><div class="lab">HOURS<br>ЦАГ</div></div>
    <div class="sep">:</div>
    <div class="unit"><div class="num" id="m">00</div><div class="lab">MINUTES<br>МИНУТ</div></div>
    <div class="sep">:</div>
    <div class="unit"><div class="num" id="s">00</div><div class="lab">SECONDS<br>СЕКУНД</div></div>
  </div>
  <div id="done">It’s time! · Эхэллээ! 🎃</div>
  <div class="info">10.30 · 18:00 · UNIQ Center</div>
</main>
<script>
// Edit this line to change the event date/time (Ulaanbaatar time, UTC+8)
var TARGET = new Date("2026-10-30T18:00:00+08:00").getTime();
function pad(n){return n<10?"0"+n:""+n;}
function tick(){
  var left = TARGET - Date.now();
  if(left <= 0){
    document.getElementById("clock").style.display="none";
    document.getElementById("done").style.display="block";
    return;
  }
  var s = Math.floor(left/1000);
  document.getElementById("d").textContent = pad(Math.floor(s/86400));
  document.getElementById("h").textContent = pad(Math.floor(s%86400/3600));
  document.getElementById("m").textContent = pad(Math.floor(s%3600/60));
  document.getElementById("s").textContent = pad(s%60);
}
tick(); setInterval(tick, 250);
</script>
</body>
</html>
